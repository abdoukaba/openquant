[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openquant"
version = "0.3.1"
description = "Professional-grade quant toolkit using public data sources (Yahoo Finance, FRED)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "openquant contributors" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "requests>=2.31",
  "yfinance>=0.2.33",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
report    = ["matplotlib>=3.8"]
analytics = ["scikit-learn>=1.3"]          # Ledoit-Wolf, PCA factor model
calendar  = ["pandas-market-calendars>=4.3"]  # precise exchange calendars
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.6.0",
]
full = [
  "matplotlib>=3.8",
  "scikit-learn>=1.3",
  "pandas-market-calendars>=4.3",
]

[project.scripts]
openquant = "openquant.cli:main"

[tool.setuptools]
packages = [
  "openquant",
  "openquant.backtest",
  "openquant.core",
  "openquant.data",
  "openquant.instruments",
  "openquant.risk",
  "openquant.ts",
  "openquant.viz",
]
include-package-data = false

[tool.setuptools.package-dir]
openquant = "src"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
